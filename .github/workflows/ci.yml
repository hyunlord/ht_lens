name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        # ubuntu-latest ships shellcheck; fail fast on script regressions.
        run: shellcheck scripts/*.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Set up Node 22
        # The viewer JS tests run the real modules via node subprocess.
        # ubuntu-latest ships node 20+; pin it so the JS tests never silently skip.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install jsdom (Phase 8e-3)
        # The 11 jsdom-based viewer tests resolve jsdom via _find_jsdom(), whose
        # first candidate is the repo-local node_modules/jsdom. Without this the
        # tests skip on a clean runner (the host-path fallbacks don't exist in CI).
        run: npm ci

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy src/

      - name: Pytest (fast)
        run: uv run pytest -m "not llm and not slow"
