name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        # ubuntu-latest ships shellcheck; fail fast on script regressions.
        run: shellcheck scripts/*.sh

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Set up Node 22
        # font_fit_js runs the JS algorithm via node subprocess. ubuntu-latest
        # already ships node 20+; this step pins it explicitly so the JS test
        # never silently skips in CI.
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy strict
        run: uv run mypy src/

      - name: Pytest (fast)
        run: uv run pytest -m "not llm and not slow"
