[project]
name = "ht-lens"
version = "0.0.0"
description = "PDF(한/영) 레이아웃 보존 번역 + 블록 단위 AI 대화 로컬 도구"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "pydantic>=2",
  "pydantic-settings>=2",
  "structlog>=24",
  "typer>=0.12",
  "pymupdf>=1.24,<1.26",
  "pillow>=10",
  "langdetect>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio",
  "pytest-cov",
  "ruff>=0.6",
  "mypy>=1.11",
  "pre-commit",
  "syrupy>=4",
]

[project.scripts]
ht-lens = "ht_lens.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ht_lens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["ht_lens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --cov=ht_lens --cov-report=term-missing"
testpaths = ["tests"]
markers = [
  "slow: 외부 API/IO 무거운 테스트",
  "llm: 실제 LLM 호출 테스트 (기본 skip)",
]

[tool.coverage.run]
source = ["ht_lens"]
branch = true
