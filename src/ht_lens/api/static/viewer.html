<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>ht_lens — viewer</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/viewer.css" />
    <link rel="stylesheet" href="css/chat_panel.css" />
    <link rel="stylesheet" href="css/search_modal.css" />
    <!-- Phase 6i: KaTeX font-face declarations + math display rules.
         Only viewer.html links this — index.html (document list) has no
         block overlay or chat panel. -->
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  </head>
  <body>
    <div class="viewer-shell" id="viewer-shell">
      <header class="app-header">
        <button
          type="button"
          class="sidebar-toggle"
          id="sidebar-toggle"
          aria-label="사이드바 토글"
          title="사이드바 토글"
        >◀</button>
        <a class="app-logo" href="/static/index.html" title="문서 목록으로"
          ><h1>ht_lens</h1></a>
        <span class="meta">no document loaded</span>
        <div class="key-hints">
          <span><kbd>←</kbd>/<kbd>→</kbd> page</span>
          <span><kbd>T</kbd> mode (번역 / 원문 / 비교)</span>
          <span><kbd>Ctrl/Cmd</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> zoom</span>
          <span><kbd>Ctrl/Cmd</kbd>+<kbd>B</kbd> panel</span>
          <span><kbd>Ctrl/Cmd</kbd>+<kbd>K</kbd> search</span>
          <span><kbd>Esc</kbd> close</span>
        </div>
      </header>
      <aside class="sidebar"></aside>
      <main class="page-area">
        <div id="status" class="status-banner" hidden></div>
        <div id="summary-banner-mount" class="summary-banner-mount" hidden></div>
        <div id="stage" class="stage-container"></div>
      </main>
      <aside class="right-slot chat-panel-host" hidden></aside>
    </div>
    <div id="search-modal-mount" hidden></div>
    <script type="module" src="js/viewer.js"></script>
  </body>
</html>
