<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>ht_lens — documents</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/viewer.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>ht_lens</h1>
      <span class="meta">documents</span>
    </header>
    <main>
      <div id="status" class="status-banner" hidden></div>
      <section class="upload-zone" id="upload-zone">
        <p class="upload-hint">PDF 파일을 여기에 드롭하거나</p>
        <button type="button" id="upload-button" class="upload-btn">파일 선택</button>
        <input type="file" id="upload-input" accept=".pdf,application/pdf" hidden />
      </section>
      <section class="active-jobs" id="active-jobs" hidden></section>
      <section class="documents-list">
        <div class="doc-card-grid" id="doc-grid"></div>
      </section>
    </main>
    <script type="module" src="js/index.js"></script>
  </body>
</html>
