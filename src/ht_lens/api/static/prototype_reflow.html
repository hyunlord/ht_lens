<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>ht_lens — reflow prototype</title>
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <style>
      :root {
        --fg: #1a1a1a;
        --muted: #888;
        --border: #d8d8d8;
        --bg: #fefefe;
        --bg-panel: #f7f7f7;
        --accent: #2a5ada;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK KR", sans-serif;
        line-height: 1.85;
        font-size: 17px;
      }

      .top {
        position: sticky; top: 0; z-index: 20;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
        padding: 0.6em 1em;
        display: flex; gap: 0.8em; align-items: center;
        font-size: 14px;
      }
      .top h1 { margin: 0; font-size: 1.05em; font-weight: 600; }
      .top label { color: var(--muted); }
      .top input { width: 4.5em; padding: 0.2em 0.4em; font-size: inherit; }
      .top button { padding: 0.3em 0.8em; font-size: inherit; cursor: pointer; }
      .top .mode { margin-left: auto; }

      .layout { display: grid; gap: 0; }
      .layout[data-mode="compare"] { grid-template-columns: 1fr 1fr; }
      .layout[data-mode="reflow-only"] { grid-template-columns: 1fr; }

      .pane { padding: 1.5em 2em; min-height: 100vh; }
      .pane--pdf {
        background: var(--bg-panel);
        border-right: 1px solid var(--border);
        overflow: auto;
      }
      .pane--pdf img {
        display: block; max-width: 100%; margin: 0 auto 1em;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }
      .pane--pdf .page-label {
        text-align: center; color: var(--muted); font-size: 12px;
        margin: 0.5em 0 0.2em;
      }

      .pane--reflow { max-width: 760px; margin: 0 auto; }

      .reflow-header {
        font-size: 1.35em; font-weight: 700;
        margin: 1.8em 0 0.4em;
        color: #111;
      }
      .reflow-text { margin: 0.7em 0; }
      .reflow-text--empty { color: var(--muted); font-style: italic; }
      .reflow-image {
        display: block; margin: 1.4em auto; max-width: 100%;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }
      .reflow-image-cap {
        text-align: center; color: var(--muted); font-size: 12px;
        margin-top: 0.2em;
      }

      .page-divider {
        text-align: center; color: var(--muted); font-size: 12px;
        margin: 2em 0 1em;
        border-top: 1px dashed var(--border);
        padding-top: 0.4em;
        letter-spacing: 0.08em;
      }

      .katex { font-size: 1em; }
      .katex-display { margin: 0.6em 0; overflow-x: auto; }
      .katex-error { color: #b00020; }

      .status { color: var(--muted); padding: 1em 0; }
      .err { color: #b00020; padding: 1em 0; }
    </style>
  </head>
  <body>
    <header class="top">
      <h1>reflow prototype</h1>
      <label>doc <input id="doc" type="number" min="1" value="7" /></label>
      <label>pages <input id="start" type="number" min="1" value="996" /> – <input id="end" type="number" min="1" value="998" /></label>
      <button id="load">load</button>
      <span class="mode">
        <label><input type="radio" name="mode" value="compare" checked /> 좌: PDF 원본 / 우: reflow 번역</label>
        <label><input type="radio" name="mode" value="reflow-only" /> reflow 단독</label>
      </span>
    </header>

    <div id="layout" class="layout" data-mode="compare">
      <div class="pane pane--pdf" id="pane-pdf"></div>
      <div class="pane pane--reflow" id="pane-reflow">
        <div class="status">로딩 중…</div>
      </div>
    </div>

    <script type="module">
      import { applyMath } from "./js/utils/render_markdown.js";

      const $ = (id) => document.getElementById(id);
      const layout = $("layout");
      const paneReflow = $("pane-reflow");
      const panePdf = $("pane-pdf");

      function render(blocks, docId, startPage, endPage) {
        paneReflow.replaceChildren();
        panePdf.replaceChildren();

        let lastPage = null;
        for (const block of blocks) {
          if (block.page !== lastPage) {
            const div = document.createElement("div");
            div.className = "page-divider";
            div.textContent = `page ${block.page}`;
            paneReflow.appendChild(div);
            lastPage = block.page;
          }
          if (block.type === "image") {
            const img = document.createElement("img");
            img.className = "reflow-image";
            img.alt = `block ${block.id} crop from page ${block.page}`;
            img.src = block.crop_url;
            img.loading = "lazy";
            paneReflow.appendChild(img);
            const cap = document.createElement("div");
            cap.className = "reflow-image-cap";
            cap.textContent = `(image crop · page ${block.page}, block ${block.id})`;
            paneReflow.appendChild(cap);
          } else {
            const el = document.createElement("div");
            el.className = block.type === "header" ? "reflow-header" : "reflow-text";
            const text = block.translated || block.original || "";
            if (!text) {
              el.classList.add("reflow-text--empty");
              el.textContent = "(empty block)";
            } else {
              el.textContent = text;
            }
            paneReflow.appendChild(el);
            // KaTeX only on translation content; el.textContent above means
            // applyMath's auto-render walks plain text nodes and only emits
            // KaTeX spans for paired ``$...$`` / ``$$...$$``.
            applyMath(el);
          }
        }

        // Left pane: full page renders for the original PDF.
        for (let p = startPage; p <= endPage; p += 1) {
          const lbl = document.createElement("div");
          lbl.className = "page-label";
          lbl.textContent = `page ${p}`;
          panePdf.appendChild(lbl);
          const img = document.createElement("img");
          img.alt = `page ${p}`;
          img.loading = "lazy";
          img.src = `/documents/${docId}/pages/${p}/image`;
          panePdf.appendChild(img);
        }
      }

      async function loadReflow() {
        const docId = Number($("doc").value);
        const start = Number($("start").value);
        const end = Number($("end").value);
        paneReflow.replaceChildren();
        const status = document.createElement("div");
        status.className = "status";
        status.textContent = `loading doc ${docId} pages ${start}–${end}…`;
        paneReflow.appendChild(status);
        try {
          const r = await fetch(
            `/prototype/documents/${docId}/reflow?start_page=${start}&end_page=${end}`,
          );
          if (!r.ok) {
            const body = await r.text();
            throw new Error(`HTTP ${r.status}: ${body.slice(0, 200)}`);
          }
          const data = await r.json();
          render(data.blocks, docId, start, end);
        } catch (e) {
          paneReflow.replaceChildren();
          const err = document.createElement("div");
          err.className = "err";
          err.textContent = `load failed: ${e.message}`;
          paneReflow.appendChild(err);
          console.error(e);
        }
      }

      $("load").addEventListener("click", loadReflow);
      for (const r of document.querySelectorAll('input[name="mode"]')) {
        r.addEventListener("change", (e) => {
          layout.dataset.mode = e.target.value;
        });
      }

      // Honour ?doc=7&start=996&end=998 query params.
      const q = new URLSearchParams(location.search);
      if (q.get("doc")) $("doc").value = q.get("doc");
      if (q.get("start")) $("start").value = q.get("start");
      if (q.get("end")) $("end").value = q.get("end");
      loadReflow();
    </script>
  </body>
</html>
